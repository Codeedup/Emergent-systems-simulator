<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module">

        import '/src/style.css';

        import * as THREE from 'three';
        import createWasmModule from "../rd/rd_web.js";
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js'; // import for camera movement
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';// import to load in the xwing
        
        async function start(WasmModule) { // changed to async because we are using await for the xwing model
            
            if (!WasmModule) return;
            
            // in cells and pixels
            const width = 256;
            const height = 256;

            // make it bigger!
            WasmModule._set_width(width);
            WasmModule._set_height(height);
            
            // 1. Initialize the C logic
            WasmModule._setup_reaction_diffusion();
            
            // 2. Get data from C (should be 512 as above, this is redundant, just to show you how it works)
            if( width !== WasmModule._get_width()) throw SyntaxError(`Width != width!`);
            if( height !== WasmModule._get_height()) throw SyntaxError(`Height != height!`);
            
            // 3. Set up GoL canvas 
            
            const golCanvas = document.getElementById( 'gol-canvas' );
            const ctxGoL = golCanvas.getContext( '2d' );
            golCanvas.width = width;
            golCanvas.height = height;
            golCanvas.fillStyle = '#000';
            // Make it bigger on screen using CSS
            golCanvas.style.width = (width*2) + 'px';
            golCanvas.style.height = (height*2) + 'px';
            
            // new reaction diffusion texture
            const GoLTexture = new THREE.CanvasTexture( ctxGoL.canvas );
            
            // Create an ImageData object for ultra-fast pixel manipulation
            const imageData = ctxGoL.createImageData(width, height);
            
            let lastFrameTime = 0;
            const targetFPS = 60; 
            const frameInterval = 1000 / targetFPS;
            
            let mouseDown = false;
            
            golCanvas.addEventListener('mousedown', (e) => {
                mouseDown = true;
            });
            
            // capture everywhere
            addEventListener('mouseup', (e) => {
                mouseDown = false; 
            });
            golCanvas.addEventListener('mousemove', (e) => {
                if (!mouseDown) return;
                
                const rect = golCanvas.getBoundingClientRect(); // get size of canvas element
                const scaleX = width / rect.width; // get scale factors
                const scaleY = height / rect.height;
                // note: e.clientX is the coordinate relative to the canvas element (0-width of canvas)
                const x = Math.floor((e.clientX - rect.left) * scaleX); // calculate grid position
                const y = Math.floor((e.clientY - rect.top) * scaleY);
                
                if (x >= 0 && x < width && y >= 0 && y < height) {
                    console.log(`setting cell ${x} ${y}`);
                    WasmModule._set_cell(x, y);
                    const pixelIndex = (y*width + x)*4; // account for scaling of 2x2
                    imageData.data[pixelIndex] = 20;
                    imageData.data[pixelIndex+1] = 255;
                    imageData.data[pixelIndex+2] = 80;
                    imageData.data[pixelIndex+3] = 255;
                    ctxGoL.putImageData(imageData, 0, 0); // update in canvas
                }
            });
            
            //-----------------------------------------------------------------
            // 4. Set up 3D Canvas
            const canvas = document.getElementById('webgl-canvas');
            canvas.style.width = (width*2) + 'px';
            canvas.style.height = (height*2) + 'px';
            
            
            const renderer = new THREE.WebGLRenderer( { antialias: true, canvas } );
            
            const fov = 50;
            const aspect = 2; // the canvas default
            const near = 0.1;
            const far = 100;
            const camera = new THREE.PerspectiveCamera( fov, aspect, near, far );
            camera.position.set(-7, 5, 15); //camera further back because sphere is bigger than cube
            
            //making the reaction pause at some point because its causing too much lag
            let reactionPaused = false
            const reactionPausedAfter = 12000;


            // camera moving ability
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // keys for our camera movement 
            const keys = {
                w: false,
                a: false,
                s: false,
                d: false
            };

            //checks when the keys have been pressed for camera movement
            window.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();

                if (key in keys) {
                    keys[key] = true;
                }
            });

            // stops the press when key is released again
            window.addEventListener('keyup', (e) => {
                const key = e.key.toLowerCase();

                if (key in keys) {
                    keys[key] = false;
                }
            });

            //adding wasd camera movement to inspect the whole scene 
            function updateCameraMovement() {
                const moveSpeed = 0.06;

                const forward = new THREE.Vector3();
                camera.getWorldDirection(forward);
                forward.y = 0;
                forward.normalize();

                const right = new THREE.Vector3();
                right.crossVectors(forward, camera.up).normalize();

                if (keys.w) {
                    camera.position.addScaledVector(forward, moveSpeed);
                    controls.target.addScaledVector(forward, moveSpeed);
                }

                if (keys.s) {
                    camera.position.addScaledVector(forward, -moveSpeed);
                    controls.target.addScaledVector(forward, -moveSpeed);
                }

                if (keys.a) {
                    camera.position.addScaledVector(right, -moveSpeed);
                    controls.target.addScaledVector(right, -moveSpeed);
                }

                if (keys.d) {
                    camera.position.addScaledVector(right, moveSpeed);
                    controls.target.addScaledVector(right, moveSpeed);
                }
            }

            const scene = new THREE.Scene();


            // added light because the xwing models need it 
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);

            //establish a new background for the scene:
            scene.background = new THREE.Color(0x000000);

            // geometry starts here for our objects:
            
           const planetRadius = 3
           const planetWidth = 16
           const planetHeight = 16

           const planetGeometry = new THREE.SphereGeometry(planetRadius, planetWidth, planetHeight)

           const starGeometry = new THREE.SphereGeometry(0.035, 4, 4);

           const galaxyGeometry = new THREE.SphereGeometry(0.020, 4,4);

           const deathStarGeo = new THREE.SphereGeometry(0.6, 24, 12);

           const dishGeometry = new THREE.CircleGeometry(0.21, 32);

           const seamGeometry = new THREE.TorusGeometry(0.615, 0.018, 8, 48);

           const shipGeometry = new THREE.ConeGeometry(0.035, 0.12, 8);
           shipGeometry.rotateX(Math.PI /2);// makes sure the ships are angled correctly


            

            //materials (textures) -------
            const material = new THREE.MeshBasicMaterial( {
                map: GoLTexture,
            } );

            const whiteMaterial = new THREE.MeshBasicMaterial({
                color: 0xffffff
            })

            const deathStarMaterial = new THREE.MeshBasicMaterial({
                color:0x808080
            })

            const dishMaterial = new THREE.MeshBasicMaterial({
                color:0x222222
            })

            const seamMaterial = new THREE.MeshBasicMaterial({
                color:0x111111
            })

            const shipMaterial = new THREE.MeshBasicMaterial({
                color: 0xff4444
            });

            const laserMaterial = new THREE.LineBasicMaterial({
                color: 0xff0000
            });


            const explosionMaterial = new THREE.MeshBasicMaterial({
                color: 0xffaa00
            })



           
            
            //meshes -------
            const planet = new THREE.Mesh( planetGeometry, material ); //main planet (Alderaan)
            scene.add( planet );
            planet.rotation.y = Math.PI; // flips the planet so you see the reaction straight away 



            for (let i = 0; i < 100; i++ ) { //background stars
                const star = new THREE.Mesh( starGeometry, whiteMaterial);
                
                //create random locations for that stars to spawn in:
                const randomX = Math.random() * 40 - 20;
                const randomY = Math.random() * 24 - 12;
                const randomZ = Math.random() * 35 - 30;
                star.position.set(randomX, randomY, randomZ);
                scene.add(star)

            }

            const deathStar = new THREE.Mesh(deathStarGeo, deathStarMaterial);
            // deathStar.position.set(1.5, 0, 0); 
            scene.add(deathStar);

            const dish = new THREE.Mesh(dishGeometry, dishMaterial);
            dish.position.set(0 , 0.27, 0.54);
            dish.rotation.x = -0.35;
            deathStar.add(dish);

            const seam = new THREE.Mesh(seamGeometry, seamMaterial);
            seam.rotation.x = Math.PI / 2;
            deathStar.add(seam);

            let orbitAngle = Math.PI; // variable that will update the death star position eventually
            const deathStarOrbitRadius = 5;





            //---------- Everything boids related------ 
            

            //This is where we get the ships spawned in
            const ships = [];
            const shipCount = 5; 
            const shipSpawnRadius = 8;
            const squadronSpawnCenter = new THREE.Vector3(-8, 1.5, 2);
            const squadronSpread = 0.4;

            let xwingModel = null;

            // Test loading of xwing model, code is from Evan Raskob but changed to GLB because its smaller:
            const loader = new GLTFLoader();
            const obj = await loader.loadAsync('./xwing/x-wing.glb');

            xwingModel = obj.scene;
            xwingModel.scale.set(0.001, 0.001, 0.001);



            for (let i = 0; i < shipCount; i++) {
                // const ship = new THREE.Mesh(shipGeometry, shipMaterial);     OLD!! Ships before we loaded the model


                const ship = xwingModel.clone(true);

                const spawnAngle = Math.random() * Math.PI * 2;
                const spawnHeight = randomOffset(2);

                 ship.position.set(
                squadronSpawnCenter.x + randomOffset(squadronSpread),
                squadronSpawnCenter.y + randomOffset(squadronSpread * 0.4),
                squadronSpawnCenter.z + randomOffset(squadronSpread)
                );
               
                //random movement for now 
                ship.userData.velocity = new THREE.Vector3(
                    randomOffset(0.01),
                    randomOffset(0.01),
                    randomOffset(0.01)
                );

                scene.add(ship);
                ships.push(ship);
            }

            // now to make them follow the Death Star
            const seekForce = new THREE.Vector3();
            const lookAtTarget = new THREE.Vector3();

            const sepForce = new THREE.Vector3();
            const aliForce = new THREE.Vector3();
            const cohForce = new THREE.Vector3();
            const diff = new THREE.Vector3();
            const deathStarAvoidForce = new THREE.Vector3();

            const shipVisualRange = 2;

            const lasers = []; // initial lazer count 
            const explosionParticles = [];
            let deathStarExploded = false;


            // function that takes ship position and direction and then adds a line or laser
            function fireLaser(ship) {
                const direction = new THREE.Vector3();
                ship.getWorldDirection(direction); // get ships direction so that we can orient the laser 
                direction.normalize();

                const start = ship.position.clone();
                const end = ship.position.clone().addScaledVector(direction, 0.18);

                const laserGeometry = new THREE.BufferGeometry().setFromPoints([
                    start,
                    end
                ]);

                const laser = new THREE.Line(laserGeometry, laserMaterial);

                laser.userData.velocity = direction.multiplyScalar(0.1);
                laser.userData.life = 20;

                scene.add(laser);
                lasers.push(laser);
            }

            function updateShips() {
                for (let i = 0; i < ships.length; i++) {
                    const ship = ships[i];
                    const pos = ship.position;
                    const vel = ship.userData.velocity;

                    // Reset forces for this ship
                    sepForce.set(0, 0, 0);
                    aliForce.set(0, 0, 0);
                    cohForce.set(0, 0, 0);

                    let neighborsCount = 0;


                // seek the death star if it exists otherwise run away. 
                if (!deathStarExploded) {
                    seekForce.copy(deathStar.position).sub(pos); // steer ship toward the Death Star by subtracting ship from target
                    seekForce.normalize().multiplyScalar(0.0002);
                    vel.add(seekForce);
                } else {
                    seekForce.copy(pos).sub(explosionCenter);
                    seekForce.normalize().multiplyScalar(0.0004);
                    vel.add(seekForce);
}
                    const deathStarAvoidRadius = 0.9; // making sure the ships don't fly though the death star


                    //  Boid neighbour rules adapted from boids/main.js from Week 7
                    for (let j = 0; j < ships.length; j++) {
                        if (i === j) continue;

                        const otherShip = ships[j];
                        const otherPos = otherShip.position;

                        const distance = pos.distanceTo(otherPos);

                        if (distance > 0 && distance < shipVisualRange) {
                            // Separation: move away from nearby ships
                            diff.copy(pos).sub(otherPos);
                            diff.normalize().divideScalar(distance); // closer ships push harder to get away 
                            sepForce.add(diff);

                            // copy nearby ships' velocity 
                            aliForce.add(otherShip.userData.velocity);

                            //  move toward average position of nearby ships 
                            cohForce.add(otherPos);

                            neighborsCount++;
                        }
                    }

                    // Apply boid forces if this ship has neighbours
                    if (neighborsCount > 0) {
                        aliForce.divideScalar(neighborsCount);

                        cohForce.divideScalar(neighborsCount);
                        cohForce.sub(pos);

                        sepForce.multiplyScalar(0.003);
                        aliForce.multiplyScalar(0.02);
                        cohForce.multiplyScalar(0.01);

                        vel.add(sepForce);
                        vel.add(aliForce);
                        vel.add(cohForce);
                    }
                    
                    
                    const distanceToDeathStar = pos.distanceTo(deathStar.position);

                    //this part here stops ships from crashing into death star using a vector pointing away from it 
                    if (distanceToDeathStar < deathStarAvoidRadius) {
                        deathStarAvoidForce.copy(pos).sub(deathStar.position);
                        deathStarAvoidForce.normalize();

                        const pushStrength = (deathStarAvoidRadius - distanceToDeathStar) * 0.05;

                        deathStarAvoidForce.multiplyScalar(pushStrength);

                        vel.add(deathStarAvoidForce);
                    }
                    // this one here stops them from crashing into planet (Alderaan)
                    const planetAvoidRadius = 4.5;
                    const planetAvoidForce = new THREE.Vector3();

                    const distanceToPlanet = pos.distanceTo(planet.position);

                    if (distanceToPlanet < planetAvoidRadius) {
                        planetAvoidForce.copy(pos).sub(planet.position);
                        planetAvoidForce.normalize();

                        const pushStrength = (planetAvoidRadius - distanceToPlanet) * 0.05;

                        planetAvoidForce.multiplyScalar(pushStrength);
                        vel.add(planetAvoidForce);
                        
                    }
            
                    

                    //  Speed limit
                    if (vel.length() > 0.012) {
                        vel.normalize().multiplyScalar(0.012);
                    }

                    // Move ship
                    pos.add(vel);

                    // Rotate ship to face movement direction
                    lookAtTarget.copy(pos).add(vel);
                    ship.lookAt(lookAtTarget);

                    if (Math.random() < 0.01) { // randomly fires the lazer particle from the ships 
                        fireLaser(ship);
                    }
                }
         }

            //Fractal 

            //randomize helper  function:
            function randomOffset(range) {
                return (Math.random() - 0.5) * 2 * range;
            }

            const galaxyGroup = new THREE.Group();
            scene.add(galaxyGroup);

            //recursive function for galaxy creation
            function createCluster (position, size, depth){
                
                if (depth <= 0){ //stops infinite recursion 
                    return;
                }
                // creating normal stars around the cluster center 
                const starsincluster = 8;

                for (let i = 0; i < starsincluster; i++){
                    const star = new THREE.Mesh(galaxyGeometry, whiteMaterial);

                    const x = position.x + randomOffset(size);
                    const y = position.y + randomOffset(size);
                    const z = position.z + randomOffset(size * 0.2);

                    star.position.set(x, y, z);

                    // adding smaller stars furher back
                    const starScale = depth * 0.5;
                    star.scale.set(starScale, starScale, starScale);

                    galaxyGroup.add(star);
                    galaxyGroup.rotation.z += 0.0005;
                }

                //making smaller cluster around the original cluster

                const childClusters =2;

                for (let i =0; i < childClusters; i++){
                    const childPosition = new THREE.Vector3(
                        position.x + randomOffset(size),
                        position.y + randomOffset(size),
                        position.z + randomOffset(size * 0.2)
                    );
                    createCluster(childPosition, size * 0.5, depth - 1);
                }
            }
            
            // Galaxy Structure - with some conceptual help from ChatGPT 5.5

            const arms = 2;
            const pointsPerArm = 24;
            const galaxyZ = -18;

            for (let arm = 0; arm < arms; arm++) {

                const armOffset = (arm / arms) * Math.PI * 2;

                for (let i = 0; i < pointsPerArm; i++) {

                    const t = i / pointsPerArm;

                    const radius = t * 7.0;
                    const angle = t * Math.PI * 4 + armOffset;

                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;

                    const position = new THREE.Vector3(x, y, galaxyZ);

                    createCluster(position, 0.4, 2);
                }
            }
            
            
            
            function resizeRendererToDisplaySize( renderer ) {
                
                const canvas = renderer.domElement;
                const width = canvas.clientWidth;
                const height = canvas.clientHeight;
                const needResize = canvas.width !== width || canvas.height !== height;
                if ( needResize ) {
                    
                    renderer.setSize( width, height, false );
                    
                }
                
                return needResize;
                
            }

            function updateLasers() {
                for (let i = lasers.length - 1; i >= 0; i--) {
                    const laser = lasers[i];

                    laser.position.add(laser.userData.velocity);
                    laser.userData.life--;

                    if (laser.userData.life <= 0) {
                        scene.remove(laser);
                        laser.geometry.dispose();
                        lasers.splice(i, 1);
                    }
                }
            }


            let explosionCenter = new THREE.Vector3();
            // adding particle "explosion" for death star 
            function explodeDeathStar() {
                if (deathStarExploded) return;

                deathStarExploded = true;

                explosionCenter.copy(deathStar.position);

                deathStar.visible = false; // makes the death star invisibile so it looks like it exploded

                for (let i = 0; i < 60; i++) {
                    // creates random explosion particles 
                    const particleGeometry = new THREE.SphereGeometry(0.04, 6, 6);
                    const particle = new THREE.Mesh(particleGeometry, explosionMaterial);

                    particle.position.copy(explosionCenter);

                    const velocity = new THREE.Vector3(
                        randomOffset(0.08),
                        randomOffset(0.08),
                        randomOffset(0.08)
                    );

                    particle.userData.velocity = velocity;
                    particle.userData.life = 80;

                    scene.add(particle);
                    explosionParticles.push(particle);
                }
            }

            function updateExplosionParticles() {
                for (let i = explosionParticles.length - 1; i >= 0; i--) {
                    const particle = explosionParticles[i];

                    particle.position.add(particle.userData.velocity); // makes the particles fly outward like an explosion
                    particle.userData.velocity.multiplyScalar(0.98);
                    particle.userData.life--;

                    if (particle.userData.life <= 0) { // remove the particles after particle.userData.life hits zero
                        scene.remove(particle);
                        particle.geometry.dispose(); // added so that memory doesn't build up
                        explosionParticles.splice(i, 1); // removes it from the array 
                    }
                }
            }
            
            // 5. The Render Loop
            function render(currentTime) {
                
                // Ask the browser to call render() again on the next frame
                requestAnimationFrame(render);
                
                // ------------- ThreeJS: on resizing window ---------------------
                if ( resizeRendererToDisplaySize( renderer ) ) {
                    
                    const canvas = renderer.domElement;
                    camera.aspect = canvas.clientWidth / canvas.clientHeight;
                    camera.updateProjectionMatrix();
                    
                }
                // -
                updateCameraMovement();// inputs our camera movement

                controls.update();
                
                if (mouseDown) return; // don't do anything if drawing
                
                const deltaTime = currentTime - lastFrameTime;

                
                //death star orbiting logic 
                orbitAngle += 0.002

                const deathStarOffset = new THREE.Vector3(deathStarOrbitRadius, 0, 0); //the deathstar starts with its local offset from the planet
                
                // buildling rotation matrix that uses the Offset vector 
                const orbitMatrix = new THREE.Matrix4();

                orbitMatrix.makeRotationY(orbitAngle); //rotation matrix turns 

                deathStarOffset.applyMatrix4(orbitMatrix); //Matrix is used to rotate around Y axis

                deathStar.position.copy(deathStarOffset); // the rotated vector is now Death Star's world position instead of old local

                updateShips(); //updates where the ships and look based on the new Death Star's position
                updateLasers(); // call our laser function after ships so we get the correct position and direction
                updateExplosionParticles(); // get the explosionswas
                

                // gets the death star position and starts timer before explosion. 
                deathStar.position.copy(deathStarOffset);
                if (currentTime > 15000) {
                    explodeDeathStar();
                }


                if (deltaTime >= frameInterval) {
                    lastFrameTime = currentTime - (deltaTime % frameInterval);
                    
                    if (currentTime > reactionPausedAfter) {
                        reactionPaused = true;
                    }
                                        
                    // Pause the reaction after 10 seconds to reduce lag
                    if (!reactionPaused) {
                        WasmModule._iterate();
                    }
                    
                    const gridPointer = WasmModule._get_grid_ptr();
                    
                    
                    // Use HEAPU8 for unsigned 8-bit integers
                    const safeMemoryView = WasmModule.HEAPU8.subarray(gridPointer, gridPointer + (width * height));
                    
                    
                    // Read the WASM memory and push it to the Canvas pixels. Changed the intial function to be reaction diffusion instead of conway
                    for (let i = 0; i < width * height; i++) {
                        const value = safeMemoryView[i];
                        
                        // ImageData expects a 1D array of RGBA values (4 bytes per pixel)
                        const pixelIndex = i * 4; 
                        
                        // If alive, make it green (0, 255, 0). If dead, make it black.
                        imageData.data[pixelIndex] = 0;                 // R
                        imageData.data[pixelIndex + 1] = value ? 255 : 0; // G
                        imageData.data[pixelIndex + 2] = 255 - value;             // B
                        imageData.data[pixelIndex + 3] = 255;           // A (fully opaque)
                    }
                    
                    // Push the pixels to the GoL canvas
                    ctxGoL.putImageData(imageData, 0, 0);
                    
                    
                    
                    GoLTexture.needsUpdate = true;
                    
                    // rotate planet     
                    const speed = .0001;
                    const rot = deltaTime * speed;
                    
                    planet.rotation.y += rot; // only making it turn on its axis 

                    // render and done!
                    
                    renderer.render( scene, camera );
                    
                }
            }
            
            // Start the loop
            render();
        }
        
        createWasmModule().then(start);
        
    </script>
    <style>
        /* Canvas sizing: allow canvases to shrink so the info menu sits to the right */
        #webgl-canvas,
        #gol-canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }

        #app {
            display: flex;
            /* fallback: stack menu on top when dev server inspection isn't available */
            flex-direction: column;
            align-items: stretch;
            gap: 20px;
            flex-wrap: nowrap;
        }

        /* Make canvas-area flexible so it can shrink for the fixed-width info menu */
        #canvas-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1 1 auto;
            min-width: 0; /* allow shrinking inside flex container */
        }

        /* Keep info menu a compact box; add top gap for visual breathing room */
        #info-menu {
            width: 220px;
            flex: 0 0 220px;
            padding: 12px;
            margin-top: 12px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            font-family: Arial, sans-serif;
            border: 1px solid rgba(255,255,255,0.9);
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        #info-menu h2 {
            margin-top: 0;
            font-size: 18px;
            margin-bottom: 6px;
        }

        #info-menu p {
            font-size: 13px;
            line-height: 1.4;
            margin: 0;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="info-menu">
            <h2>Battle of Yavin</h2>
            <p>
                This is a Star Wars simulation of the Battle of Yavin.
                You can move around using WASD and look around with the mouse.
                After 15 seconds the rebels will win and the Death Star will explode.
            </p>
        </div>

        <div id="canvas-area">
            <canvas id="webgl-canvas"></canvas>
            <canvas id="gol-canvas"></canvas>
        </div>
    </div>
</body>
</html>
